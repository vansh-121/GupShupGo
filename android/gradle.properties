org.gradle.java.home=C:/Program Files/Java/jdk-17
android.useAndroidX=true
android.enableJetifier=true

# ── R8 resource optimization ────────────────────────────────────────────────
# Treats resources as part of the code reference graph instead of letting
# AAPT2-generated keep rules pin them alive, so unreferenced code+resource
# clusters can both be removed. Opt-in on AGP 8.12 (this project's version);
# default-on from AGP 9.0. Play Console → App optimization reports this as
# "Resource Shrinking Optimized".
android.r8.optimizedResourceShrinking=true
