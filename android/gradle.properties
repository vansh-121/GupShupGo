org.gradle.java.home=C:/Program Files/Java/jdk-17
android.useAndroidX=true
android.enableJetifier=true

# ── R8 resource optimization ────────────────────────────────────────────────
# Treats resources as part of the code reference graph instead of letting
# AAPT2-generated keep rules pin them alive, so unreferenced code+resource
# clusters can both be removed. Opt-in on AGP 8.12 (this project's version);
# default-on from AGP 9.0. Play Console → App optimization reports this as
# "Resource Shrinking Optimized".
android.r8.optimizedResourceShrinking=true

# ── Kotlin incremental compilation: off, deliberately ───────────────────────
# Since the Kotlin 2.3.21 bump (see android/settings.gradle for why that bump
# was forced), the compiler daemon cannot release its handles on the .tab cache
# files it just created, and the build dies with
#   Could not close incremental caches in
#   build/<plugin>/kotlin/compileDebugKotlin/cacheable/caches-jvm/...
# on device_info_plus, audioplayers_android and flutter_image_compress_common.
# These are FRESH caches, not leftovers from the old compiler — a `flutter clean`
# does not help, because the failure is file locking on Windows, not staleness.
#
# Turning incremental compilation off removes the .tab caches from the build
# entirely. It costs almost nothing here: this project has exactly one Kotlin
# file of its own (MainActivity.kt), and plugin Kotlin only recompiles when the
# plugin set changes — which is rare. Dart hot reload is untouched.
kotlin.incremental=false
