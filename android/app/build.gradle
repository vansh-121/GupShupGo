plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
    id 'com.google.gms.google-services'
    // Crashlytics Gradle plugin — enables crash reporting & symbol uploads
    id 'com.google.firebase.crashlytics'
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    namespace = "com.gupshupgo.app"
    compileSdk = 36
    // NDK 29.0.14033849 — latest stable. This project compiles no native
    // code of its own, so the NDK version is near-irrelevant to 16 KB
    // page-size alignment; it only repackages Flutter's own libflutter.so /
    // libapp.so, which are already 16 KB-aligned.
    ndkVersion = "29.0.14033849"

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        // Required by flutter_local_notifications (and any lib using Java 8 time APIs)
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    signingConfigs {
        release {
            storeFile file(keystoreProperties['storeFile'])
            storePassword keystoreProperties['storePassword']
            keyAlias keystoreProperties['keyAlias']
            keyPassword keystoreProperties['keyPassword']
        }
    }

    defaultConfig {
        applicationId = "com.gupshupgo.app"
        minSdk = flutter.minSdkVersion
        // Google Play requires existing apps to target Android 16 (API 36)
        // by August 31, 2026. compileSdk is already 36, so this just aligns
        // targetSdk to match — see Play Console policy warning.
        targetSdk = 36
        versionCode = 50
        versionName = "1.1.4"
        minSdkVersion = 24
        multiDexEnabled true
        // Strip unused locale resources from all SDKs (Firebase, GMS, Agora, etc.)
        resConfigs "en"
    }

    packagingOptions {
        // Deduplicate shared native libs that appear in multiple AARs
        pickFirst 'lib/x86/libc++_shared.so'
        pickFirst 'lib/x86_64/libc++_shared.so'
        pickFirst 'lib/armeabi-v7a/libc++_shared.so'
        pickFirst 'lib/arm64-v8a/libc++_shared.so'

        // ── Agora extension pruning ────────────────────────────────────────
        // This app only uses enableAudio() + enableVideo() (basic RTC).
        // None of the AI/feature extensions are loaded; excluding them saves
        // ~29 MB per ABI (~87 MB across 3 ABIs in the fat APK).

        // AI visual effects — not used
        exclude 'lib/*/libagora_lip_sync_extension.so'
        exclude 'lib/*/libagora_clear_vision_extension.so'
        exclude 'lib/*/libagora_face_capture_extension.so'
        exclude 'lib/*/libagora_segmentation_extension.so'
        exclude 'lib/*/libagora_face_detection_extension.so'

        // 3-D / spatial audio — not used
        exclude 'lib/*/libagora_spatial_audio_extension.so'

        // AI audio processing — not explicitly enabled in code
        exclude 'lib/*/libagora_audio_beauty_extension.so'

        // Content moderation — not used
        exclude 'lib/*/libagora_content_inspect_extension.so'

        // Video quality analyzer — not used
        exclude 'lib/*/libagora_video_quality_analyzer_extension.so'

        // AV1 codec — app uses default H.264 (no setVideoEncoderConfiguration(AV1))
        exclude 'lib/*/libagora_video_av1_encoder_extension.so'
        exclude 'lib/*/libagora_video_av1_decoder_extension.so'

        // NOTE: libagora_screen_capture_extension.so is intentionally NOT
        // excluded — it is required by the in-chat screen sharing feature
        // (AgoraService.startScreenShare). Excluding it makes
        // startScreenCapture fail with error -157 (ERR_MODULE_NOT_PRESENT).
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.release
            minifyEnabled true
            shrinkResources true
            
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    // Generate per-ABI APKs. x86 is emulator-only — no real device needs it.
    // Run: flutter build apk --split-per-abi
    // Disabled for bundle builds — AAB handles ABI splitting natively,
    // and AGP 8.12.0+ rejects splits in bundleRelease (issuetracker.google.com/402800800).
    def isBundleBuild = gradle.startParameter.taskNames.any { it.toLowerCase().contains('bundle') }
    splits {
        abi {
            enable !isBundleBuild
            reset()
            include 'arm64-v8a', 'armeabi-v7a', 'x86_64'
            universalApk true
        }
    }

    // Upload full native debug symbols to Crashlytics so Agora/NDK stacks
    // are fully deobfuscated in the Firebase console.
    buildTypes.each {
        it.ndk { debugSymbolLevel = 'FULL' }
    }
}

// ── 16 KB page-size compliance (Google Play requirement) ────────────────────
// Play rejects native libs whose ELF LOAD segments are 4 KB-aligned (p_align
// 0x1000) instead of 16 KB (0x4000).
//
// Verify any build before uploading:
//     python tools/check_16kb_alignment.py build/app/outputs/bundle/release/app-release.aab
//
// These two overrides fix the libs pulled by mobile_scanner 5.2.3's default
// transitive deps, and are still required:
//   • libimage_processing_util_jni.so — androidx.camera:camera-core 1.3.3 → 1.4.2
//       1.4.2 is 16 KB-aligned on ALL ABIs, armeabi-v7a included.
//   • libbarhopper_v3.so — com.google.mlkit:barcode-scanning 17.2.0 → 17.3.0
//       17.3.0 aligns arm64-v8a + x86_64 only; its armeabi-v7a copy is still
//       4 KB and upstream has not fixed it (googlesamples/mlkit#989), so do
//       not expect a further bump to help 32-bit.
//
// mobile_scanner stays on 5.2.3 deliberately. The old blocker (6.x/7.x needing
// AGP 8.9.1+) is gone now that this project is on AGP 8.12.0, but bumping it
// buys no alignment benefit — 17.3.0 is already the fixed MLKit release — so
// it would be churn and API-breakage risk for nothing.
configurations.all {
    // ── Drop the deprecated SafetyNet App Check provider ────────────────────
    // firebase_app_check transitively pulls firebase-appcheck-safetynet:16.1.2,
    // which drags in play-services-safetynet:18.0.0. The SafetyNet Attestation
    // API is deprecated (replaced by Play Integrity) and Google Play flags the
    // artifact with a critical-note advisory. This app only uses the Play
    // Integrity provider (AndroidProvider.playIntegrity) plus the debug provider
    // in lib/main.dart — the SafetyNet provider is never referenced — so
    // excluding it removes dead code and clears the Play Console note.
    exclude group: 'com.google.firebase', module: 'firebase-appcheck-safetynet'
    exclude group: 'com.google.android.gms', module: 'play-services-safetynet'

    resolutionStrategy {
        eachDependency { details ->
            if (details.requested.group == 'androidx.camera') {
                details.useVersion '1.4.2'
                details.because '16 KB page-size alignment (libimage_processing_util_jni.so)'
            }
        }
        force 'com.google.mlkit:barcode-scanning:17.3.0'
    }
}

dependencies {
    // The Flutter Gradle Plugin is required to build the Flutter module.
    implementation platform('com.google.firebase:firebase-bom:33.14.0')
    implementation 'com.google.firebase:firebase-analytics'
    implementation 'com.google.firebase:firebase-messaging'
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    // Debug AppCheck provider must NOT ship in the release APK
    debugImplementation 'com.google.firebase:firebase-appcheck-debug'

    // Firebase Crashlytics — crash & non-fatal error reporting
    implementation 'com.google.firebase:firebase-crashlytics'
    // Upload native (C/C++) crash symbols; needed for Agora native stacks
    implementation 'com.google.firebase:firebase-crashlytics-ndk'

    // Google Play Services Identity — for Phone Number Hint API (carrier-based verification)
    implementation 'com.google.android.gms:play-services-auth:21.3.0'

    // Core library desugaring — required by flutter_local_notifications on API < 26
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'
}

flutter {
    source = "../.."
}
