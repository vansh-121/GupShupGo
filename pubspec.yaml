name: video_chat_app
description: "A new Flutter project."
# The following line prevents the package from being accidentally published to
# pub.dev using `flutter pub publish`. This is preferred for private packages.
publish_to: "none" # Remove this line if you wish to publish to pub.dev

# The following defines the version and build number for your application.
# A version number is three numbers separated by dots, like 1.2.43
# followed by an optional build number separated by a +.
# Both the version and the builder number may be overridden in flutter
# build by specifying --build-name and --build-number, respectively.
# In Android, build-name is used as versionName while build-number used as versionCode.
# Read more about Android versioning at https://developer.android.com/studio/publish/versioning
# In iOS, build-name is used as CFBundleShortVersionString while build-number is used as CFBundleVersion.
# Read more about iOS versioning at
# https://developer.apple.com/library/archive/documentation/General/Reference/InfoPlistKeyReference/Articles/CoreFoundationKeys.html
# In Windows, build-name is used as the major, minor, and patch parts
# of the product and file versions while build-number is used as the build suffix.
version: 1.1.6+52

environment:
  sdk: ">=3.2.0 <4.0.0"

# Dependencies specify other packages that your package needs in order to work.
# To automatically upgrade your package dependencies to the latest versions
# consider running `flutter pub upgrade --major-versions`. Alternatively,
# dependencies can be manually updated by changing the version numbers below to
# the latest version available on pub.dev. To see which dependencies have newer
# versions available, run `flutter pub outdated`.
dependencies:
  flutter:
    sdk: flutter
  firebase_core: ^2.27.0
  firebase_messaging: ^14.7.19
  firebase_auth: ^4.17.8
  cloud_firestore: ^4.15.8
  firebase_storage: ^11.6.9
  firebase_app_check: ^0.2.1+8
  firebase_crashlytics: ^3.4.8
  firebase_performance: ^0.9.4
  firebase_database: ^10.4.0
  firebase_remote_config: ^4.3.14

  # Agora RTC Engine
  agora_rtc_engine: ^6.3.1
  audioplayers: ^5.2.1

  # Pinned >=6.3.0 — that version switched to Flutter's builtin AssetManifest
  # API. Versions before 6.3.0 (e.g. 5.1.0) read the legacy AssetManifest.json
  # directly, which fails to load on newer Flutter SDKs (3.38.10, pinned via
  # .fvmrc) and causes "Unable to load asset: AssetManifest.json" font
  # loading errors at runtime.
  google_fonts: ^6.3.3
  qr_flutter: ^4.1.0

  # Device contact matching (Discover tab "Sync Device Contacts").
  # Pinned to the 1.1.x line — 2.x requires Flutter >=3.44, newer than the
  # 3.24.3 currently used by this project.
  flutter_contacts: ^1.1.9

  # Deep link handling for profile QR codes / share links
  # (https://gupshupgo.app/u/<username>).
  # Pinned to 6.3.3 — 6.4.0+ changed the Android module's build.gradle to
  # use `compileSdk = flutter.compileSdkVersion`, a property only exposed
  # by newer Flutter Gradle tooling than the 3.24.3 this project uses.
  # That mismatch causes "Could not get unknown property 'flutter'" /
  # "compileSdkVersion is not specified" build failures. 6.3.3 hardcodes
  # compileSdk 34 instead and builds cleanly.
  app_links: 6.3.3

  # Permissions
  permission_handler: ^11.1.0

  # State management
  provider: ^6.1.1

  # Local storage
  shared_preferences: ^2.2.2

  # Secure storage (Android Keystore-backed) for the device session token —
  # survives app force-stop on aggressive OEM cleaners (MIUI/HyperOS).
  flutter_secure_storage: ^9.2.2
  local_auth: ^2.1.8

  # HTTP requests
  http: ^1.1.0

  # Google Sign-In
  google_sign_in: ^6.2.1

  # CallKit for native call UI
  flutter_callkit_incoming: ^2.5.2

  # Google Play In-App Update (native full-screen update prompt)
  in_app_update: ^4.2.5

  # Google Play In-App Review (native review sheet). Same Play Core family as
  # in_app_update, and the same "Play decides" contract: requestReview() is
  # quota-limited and reports nothing back, so ReviewPromptService keeps its own
  # stricter budget in front of it rather than trusting the outcome.
  in_app_review: ^2.0.12

  # In-App Purchases (Google Play Billing — GupShupGo Pro)
  # Bumped to pull in_app_purchase_android >=0.5.0, which upgrades the
  # bundled Google Play Billing Library from 7.1.1 to 8.0.0. Google Play
  # requires all apps to use Billing Library 8.0.0+ starting Aug 31, 2026.
  # in_app_purchase_android 0.5.0 requires Flutter >=3.38.0 (pinned via
  # .fvmrc in this project — see .fvm/ and .fvmrc).
  in_app_purchase: ^3.3.0

  # Google Mobile Ads (AdMob) — banner + rewarded, gated by Remote Config.
  # 9.x needs Dart >=3.10 / Flutter >=3.38.1, satisfied by the 3.38.10 pinned
  # in .fvmrc. It pulls the webview_flutter family, but none of those packages
  # depend on `web`, so the `web ^1.0.0` vs firebase_core 2.x conflict that
  # pinned drift to 2.18.x does not apply here.
  google_mobile_ads: ^9.1.0

  # Media picker & video player
  image_picker: ^1.0.7
  url_launcher: ^6.2.1
  video_player: ^2.8.3

  # Compress images before encrypted upload (10-20× size reduction).
  flutter_image_compress: ^2.3.0
  path_provider: ^2.1.3

  # Connectivity
  connectivity_plus: ^6.0.3

  # Nearby connections (mesh networking)
  nearby_connections: ^4.1.0

  # UI components
  cupertino_icons: ^1.0.2
  device_info_plus: ^10.1.2

  # End-to-end encryption (Signal Protocol).
  # NOTE: libsignal_protocol_dart is GPL-3.0. Linking it requires this app
  # to be distributed under GPL-3.0 too. See LICENSE.
  libsignal_protocol_dart: ^0.7.1

  # Crypto primitives used by media encryption, the vault PIN KDF
  # (Argon2id), and Agora call-key derivation. Apache-2.0 / MIT.
  cryptography: ^2.7.0
  pointycastle: ^3.9.1
  crypto: ^3.0.3

  # Local persistent store for ratchet sessions, prekeys, and decrypted
  # message cache (so we don't re-decrypt on every render).
  # Drift — type-safe reactive SQLite wrapper (replaces raw sqflite).
  # Pinned to 2.18.x: 2.19.2+ depends on `web ^1.0.0` which conflicts
  # with firebase_core 2.x / firebase_app_check 0.2.x.
  drift: ">=2.18.0 <2.19.2"
  sqlite3_flutter_libs: ^0.5.24
  path: ^1.9.0

  # Local notifications for foreground FCM handling & deep-link routing.
  flutter_local_notifications: ^18.0.0

  # QR scanning for profile codes (Contacts → Scan).
  #
  # Pinned to the 5.2.x line, NOT the latest. The original reason (6.x/7.x need
  # CameraX 1.6.x, whose AAR metadata demands AGP 8.9.1+) no longer applies now
  # that android/settings.gradle is on AGP 8.12.0 — but there is still no reason
  # to bump: the 16 KB alignment fix comes from the camera/MLKit version
  # overrides in android/app/build.gradle, not from mobile_scanner itself.
  # Bumping would mean reworking lib/screens/qr_scanner_screen.dart for no gain.
  mobile_scanner: 5.2.3

  # OS share sheet, used by chat export (lib/services/chat_export_service.dart).
  #
  # Pinned to the 10.x line, NOT the latest. 11.x replaced the static
  # `Share.shareXFiles(...)` API with `SharePlus.instance.share(ShareParams(...))`
  # and raised its Dart SDK floor; 10.x is the newest line that resolves against
  # this project's other constraints without dragging anything else along. The
  # one side effect it does have is transitive: share_plus_platform_interface
  # pins `mime: ^1.0.4`, which holds `mime` at 1.0.6 instead of 2.0.0. Nothing in
  # lib/ imports `mime` directly, so that is invisible here.
  share_plus: ^10.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  drift_dev: ">=2.18.0 <2.19.2"
  build_runner: ^2.4.0
  flutter_launcher_icons: ^0.13.1

  # Property-based testing for the streak domain layer
  # (test/services/streak/**). Test-only: never imported by lib/.
  glados: 1.1.7

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"

  # The "flutter_lints" package below contains a set of recommended lints to
  # encourage good coding practices. The lint set provided by the package is
  # activated in the `analysis_options.yaml` file located at the root of your
  # package. See that file for information about deactivating specific lint
  # rules and activating additional ones.
  flutter_lints: ^4.0.0

# For information on the generic Dart part of this file, see the
# following page: https://dart.dev/tools/pub/pubspec

# The following section is specific to Flutter packages.
flutter:
  # The following line ensures that the Material Icons font is
  # included with your application, so that you can use the icons in
  # the material Icons class.
  uses-material-design: true

  # To add assets to your application, add an assets section, like this:
  assets:
    # NOTE: service-account.json is no longer bundled — FCM notifications
    # are now sent via Cloud Functions (see functions/index.js).
    - assets/icon/app_icon.png
    - assets/fonts/poppins/

  # An image asset can refer to one or more resolution-specific "variants", see
  # https://flutter.dev/to/resolution-aware-images

  # For details regarding adding assets from package dependencies, see
  # https://flutter.dev/to/asset-from-package

  # To add custom fonts to your application, add a fonts section here,
  # in this "flutter" section. Each entry in this list should have a
  # "family" key with the font family name, and a "fonts" key with a
  # list giving the asset and other descriptors for the font. For
  # example:
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/poppins/Poppins-Regular.ttf
        - asset: assets/fonts/poppins/Poppins-Italic.ttf
          style: italic
        - asset: assets/fonts/poppins/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/poppins/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/poppins/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/poppins/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/poppins/Poppins-ExtraBold.ttf
          weight: 800
